<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=edit_note"
    />
    <link rel="stylesheet" href="./src/css/style.css" />
    <title>QUADRO DE TAREFAS</title>
  </head>

  <body>
    <main>
      <header>
        <span>Project / Dev Projects</span>
        <h1>Board</h1>
      </header>
      <!-- COLUNAS -->
      <section class="columns">
        <section class="column">
          <h2 class="column_title">TO DO</h2>
          <section class="column_cards">
            <!-- draggable="true" (Permite que possamos arrastar um elemento) -->
          </section>
        </section>

        <section class="column">
          <h2 class="column_title">IN PROGRESS</h2>
          <section class="column_cards"></section>
        </section>

        <section class="column">
          <h2 class="column_title">TO REVIEW</h2>
          <section class="column_cards">
            <!-- draggable="true" (Permite que possamos arrastar um elemento) -->
          </section>
        </section>

        <section class="column">
          <h2 class="column_title">DONE</h2>
          <section class="column_cards">
            <!-- draggable="true" (Permite que possamos arrastar um elemento) -->
          </section>
        </section>
      </section>
    </main>
    <script src="./src/js/script.js"></script>
  </body>
</html>
